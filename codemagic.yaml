workflows:
  ios-sideload:
    name: Unsigned IPA (sideload)
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      xcode: latest
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Install XcodeGen
        script: brew install xcodegen
      - name: Generate Xcode project
        script: xcodegen generate
      - name: Build for device, unsigned
        script: |
          xcodebuild \
            -project TcpButtons.xcodeproj \
            -scheme TcpButtons \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            build
      - name: Package the IPA
        script: |
          APP_PATH=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "No .app produced — build failed."
            exit 1
          fi
          echo "App: $APP_PATH"
          rm -rf Payload TcpButtons.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qry TcpButtons.ipa Payload
          echo "IPA created:"
          ls -lh TcpButtons.ipa
    artifacts:
      - TcpButtons.ipa
      - /tmp/xcodebuild_logs/*.log

  ios-appstore:
    name: Publish to App Store
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: TcpButtons
    environment:
      xcode: latest
      groups:
        - code-signing
      vars:
        BUNDLE_ID: "com.0tolambo.tcpbuttons"
        XCODE_SCHEME: "TcpButtons"
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Install XcodeGen
        script: brew install xcodegen
      - name: Generate Xcode project
        script: xcodegen generate
      - name: Get build number from App Store Connect
        script: |
          LATEST_BUILD_NUMBER=$(app-store-connect get-latest-build-number "$BUNDLE_ID" || echo 0)
          agvtool new-version -all $(($LATEST_BUILD_NUMBER + 1))
      - name: Set up code signing certificates and profiles
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Build and archive the signed IPA
        script: |
          xcode-project build-ipa \
            --project TcpButtons.xcodeproj \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_app_store: false
