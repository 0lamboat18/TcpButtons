workflows:

  ios-sideload:
    name: IPA non signée (sideload)
    max_build_duration: 30
    instance_type: mac_mini_m2

    environment:
      xcode: latest

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true

    scripts:
      - name: Installer XcodeGen
        script: brew install xcodegen

      - name: Générer le projet Xcode
        script: xcodegen generate

      - name: Compiler pour appareil, sans signature
        script: |
          xcodebuild \
            -project TcpButtons.xcodeproj \
            -scheme TcpButtons \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            build

      - name: Empaqueter l'IPA
        script: |
          APP_PATH=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "Aucun .app produit — la compilation a échoué."
            exit 1
          fi
          echo "Application : $APP_PATH"

          rm -rf Payload TcpButtons.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qry TcpButtons.ipa Payload
          echo "IPA créée :"
          ls -lh TcpButtons.ipa

    artifacts:
      - TcpButtons.ipa
      - /tmp/xcodebuild_logs/*.log
